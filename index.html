<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10150f" />
    <title>Zork I — Edizione italiana</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="terminal" aria-label="Zork I, avventura testuale">
      <header>
        <a class="wordmark" href="/" aria-label="Ricomincia Zork">ZORK <small>I</small></a>
        <p>Edizione italiana · Capitolo 1</p>
      </header>
      <section id="story" aria-live="polite" aria-label="Testo dell'avventura"></section>
      <form id="command-form">
        <label for="command"><span aria-hidden="true">›</span><span class="sr-only">Comando</span></label>
        <input id="command" name="command" autocomplete="off" autofocus spellcheck="false" />
      </form>
      <footer><span>IT + EN parser</span><button type="button" id="help">AIUTO</button><span id="turns">turno 0</span></footer>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
