<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zork I — Edizione italiana</title>
    <link rel="stylesheet" href="source/web-zmachine/glkote.css" />
    <link rel="stylesheet" href="source/web-zmachine/dialog.css" />
    <style>
      body { margin: 0; min-height: 100vh; background: #10150f; color: #d8d7bd; font-family: ui-monospace, monospace; }
      #gameport { position: relative !important; box-sizing: border-box; min-height: 100vh; padding: 2rem; }
      #windowport { max-width: 760px; margin: auto; }
      .brand { position: relative; z-index: 2; max-width: 760px; margin: 0 auto 1.5rem; border-bottom: 1px solid #56614a; padding-bottom: 1rem; display: flex; align-items: baseline; justify-content: space-between; }
      .brand strong { color: #eef0c2; font: 3.2rem/.8 Georgia, serif; letter-spacing: -.08em; }
      .brand small { color: #9da978; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; }
      @media (max-width: 600px) { .brand strong { font-size: 2.5rem; } .brand small { font-size: .6rem; } }
      #gameport, #windowport, .WindowFrame, .BufferWindow, .GridWindow { background: #10150f !important; color: #b6c77a !important; }
      .BufferLine, .GridLine, .Style_normal, .Style_input, .Input { color: #b6c77a !important; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace !important; }
      .Input { background: #10150f !important; border-color: #8e9568 !important; caret-color: #e6edb0 !important; }
      #loadingpane { background: #10150f !important; color: #b6c77a !important; }
    </style>
  </head>
  <body>
    <div class="brand" aria-label="Zork I, edizione italiana"><strong>ZORK <small>I</small></strong><small>Edizione italiana · Capitolo 1</small></div><div id="gameport"><div id="windowport"></div><div id="loadingpane">Caricamento…</div><div id="errorpane" style="display:none"><div id="errorcontent"></div></div></div>
    <script src="source/web-zmachine/lib/jquery-1.12.4.min.js"></script>
    <script src="source/web-zmachine/lib/glkote.min.js"></script>
    <script src="source/web-zmachine/lib/zvm.min.js"></script>
    <script>
      fetch("zork1.z3?v=5").then(response => {
        if (!response.ok) throw new Error(`Storia non disponibile (${response.status})`);
        return response.arrayBuffer();
      }).then(story => {
        const vm = new ZVM();
        vm.prepare(story, { Glk });
        Glk.init({ vm, game_format: "ZCODE" });
      }).catch(error => {
        document.querySelector("#errorpane").style.display = "block";
        document.querySelector("#errorcontent").textContent = error.message;
      });
    </script>
  </body>
</html>
