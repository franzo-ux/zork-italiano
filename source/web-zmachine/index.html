<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zork I — Edizione italiana</title>
    <link rel="stylesheet" href="glkote.css" />
    <style>
      body { margin: 0; min-height: 100vh; background: #10150f; color: #d8d7bd; font-family: ui-monospace, monospace; }
      #gameport { box-sizing: border-box; min-height: 100vh; padding: 2rem; }
      #windowport { max-width: 760px; margin: auto; }
    </style>
  </head>
  <body>
    <div id="gameport"><div id="windowport"></div><div id="loadingpane">Caricamento…</div><div id="errorpane" style="display:none"><div id="errorcontent"></div></div></div>
    <script src="lib/jquery-1.12.4.min.js"></script>
    <script src="lib/glkote.min.js"></script>
    <script src="lib/zvm.min.js"></script>
    <script>
      fetch("../zork-it/zork1.z3").then(response => {
        if (!response.ok) throw new Error(`Storia non disponibile (${response.status})`);
        return response.arrayBuffer();
      }).then(story => {
        const vm = new ZVM();
        vm.prepare(story, { Glk });
        Glk.init({ vm, game_format: "ZCODE" });
      }).catch(error => {
        document.querySelector("#errorpane").style.display = "block";
        document.querySelector("#errorcontent").textContent = error.message;
      });
    </script>
  </body>
</html>
