<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zork I — Edizione italiana</title>
    <link rel="stylesheet" href="glkote.css" />
    <link rel="stylesheet" href="dialog.css" />
    <style>
      body { margin: 0; min-height: 100vh; background: #10150f; color: #d8d7bd; font-family: ui-monospace, monospace; }
      #gameport { position: relative !important; box-sizing: border-box; width: min(100%, 760px); min-height: 100vh; margin: 0 auto; padding: 0 0 8.5rem; }
      #windowport { max-width: 760px; margin: auto; }
      .brand { position: relative; z-index: 2; max-width: 760px; margin: 0 auto 1.5rem; border-bottom: 1px solid #56614a; padding-bottom: 1rem; display: flex; align-items: baseline; justify-content: space-between; }
      .brand strong { color: #eef0c2; font: 3.2rem/.8 Georgia, serif; letter-spacing: -.08em; }
      .brand small { color: #9da978; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; }
      @media (max-width: 600px) { .brand strong { font-size: 2.5rem; } .brand small { font-size: .6rem; } }
      #gameport, #windowport, .WindowFrame, .BufferWindow, .GridWindow { background: #10150f !important; color: #b6c77a !important; }
      .BufferLine, .GridLine, .Style_normal, .Style_input, .Input { color: #b6c77a !important; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace !important; }
      .Input { background: #10150f !important; border-color: #8e9568 !important; caret-color: #e6edb0 !important; }
      #loadingpane { background: #10150f !important; color: #b6c77a !important; }
      .minimap { position: fixed; z-index: 10; left: 50%; bottom: .75rem; transform: translateX(-50%); width: min(calc(100% - 2rem), 760px); margin: 0; border: 1px solid #56614a; padding: .55rem .8rem .65rem; background: #10150f; color: #a9ad89; }
      .minimap-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .35rem; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; }
      .minimap-head strong { color: #d9da94; font-weight: 500; }
      .minimap-head span { font-size: .6rem; opacity: .8; }
      #minimap { display: block; width: 100%; height: 110px; }
      .mini-link { stroke: #687156; stroke-width: 2; }
      .mini-node rect { fill: #293027; stroke: #89906b; stroke-width: 1.5; }
      .mini-node text { fill: #c7cd8a; font: 10px ui-monospace, monospace; text-anchor: middle; }
      .mini-node.current rect { fill: #d9da94; stroke: #fff8ca; }
      .mini-node.current text { fill: #182016; }
      @media (max-width: 600px) { #gameport { padding-bottom: 7rem; } .minimap { bottom: .5rem; } #minimap { height: 75px; } }
    </style>
  </head>
  <body>
    <div class="brand" aria-label="Zork I, edizione italiana"><strong>ZORK <small>I</small></strong><small>Edizione italiana · Capitolo 1</small></div>
    <section class="minimap" aria-label="Minimappa dell'area esplorata">
      <div class="minimap-head"><strong>Minimappa</strong><span>prototipo · area conosciuta</span></div>
      <svg id="minimap" viewBox="0 0 760 110" role="img" aria-label="Mappa dell'area iniziale">
        <line class="mini-link" x1="110" y1="55" x2="300" y2="55"/><line class="mini-link" x1="300" y1="55" x2="490" y2="55"/><line class="mini-link" x1="490" y1="55" x2="650" y2="55"/>
        <g class="mini-node current" transform="translate(110 55)"><title>A ovest della casa</title><rect x="-48" y="-18" width="96" height="36" rx="3"/><text y="4">ESTERNO</text></g>
        <g class="mini-node" transform="translate(300 55)"><title>Ingresso</title><rect x="-42" y="-18" width="84" height="36" rx="3"/><text y="4">INGRESSO</text></g>
        <g class="mini-node" transform="translate(490 55)"><title>Cucina</title><rect x="-38" y="-18" width="76" height="36" rx="3"/><text y="4">CUCINA</text></g>
        <g class="mini-node" transform="translate(650 55)"><title>Soggiorno</title><rect x="-42" y="-18" width="84" height="36" rx="3"/><text y="4">SOGGIORNO</text></g>
      </svg>
    </section><div id="gameport"><div id="windowport"></div><div id="windowport"></div><div id="loadingpane">Caricamento…</div><div id="errorpane" style="display:none"><div id="errorcontent"></div></div></div>
    <script src="lib/jquery-1.12.4.min.js"></script>
    <script src="lib/glkote.min.js"></script>
    <script src="lib/zvm.min.js"></script>
    <script>
      fetch("../../zork1.z3").then(response => {
        if (!response.ok) throw new Error(`Storia non disponibile (${response.status})`);
        return response.arrayBuffer();
      }).then(story => {
        const vm = new ZVM();
        vm.prepare(story, { Glk });
        Glk.init({ vm, game_format: "ZCODE" });
      }).catch(error => {
        document.querySelector("#errorpane").style.display = "block";
        document.querySelector("#errorcontent").textContent = error.message;
      });
    </script>
  </body>
</html>
